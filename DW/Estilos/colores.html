<html>
    <head>
        <meta charset="UTF-8">
        <title>Ejemplos de CSS</title>
        <link rel="stylesheet" href="colores.css">
    </head>
    <body>
        <center>

            <h1>Colores por nombre</h1>
            <div class="color_r caja">
                Rojo
            </div>
            <div class="color_g caja">
                Verde
            </div>
            <div class="color_b caja">
                Azul
            </div>
            <div class="color_orange caja">
                Naranja
            </div>
            <div class="color_x caja">
                X
            </div>

            <hr>

            <h1>Colores por rgb</h1>
            <div class="color_r_rgb caja">
                Rojo
            </div>
            <div class="color_g_rgb caja">
                Verde
            </div>
            <div class="color_b_rgb caja">
                Azul
            </div>
            <div class="color_orange_rgb caja">
                Naranja
            </div>
            <div class="color_x_rgb caja">
                X
            </div>

            <h1>Transparencia</h1>
            <div class="color_r_alpha caja">
                Rojo
            </div>
            <div class="color_g_alpha caja">
                Verde
            </div>
            <div class="color_b_alpha caja">
                Azul
            </div>
            <div class="color_orange_alpha caja">
                Naranja
            </div>
            <div class="color_x_alpha caja">
                X
            </div>

            <hr>
            <h1>Colores en hexadecimal</h1>
            <div class="color_r_hex caja">
                Rojo
            </div>
            <div class="color_g_hex caja">
                Verde
            </div>
            <div class="color_b_hex caja">
                Azul
            </div>
            <div class="color_orange_hex caja">
                Naranja
            </div>
            <div class="color_x_hex caja">
                X
            </div>

            <hr>
            <h1>Colores en hsl y hsla</h1>
            <div class="color_r_hsl caja">
                Rojo
            </div>
            <div class="color_g_hsl caja">
                Verde
            </div>
            <div class="color_b_hsl caja">
                Azul
            </div>
            <div class="color_orange_hsl caja">
                Naranja
            </div>
            <div class="color_x_hsl caja">
                X
            </div>
            
        </center>
    </body>
</html>
